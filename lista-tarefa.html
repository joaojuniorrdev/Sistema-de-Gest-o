<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laricão Lanches</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/lista-tarefa.css">
    <link rel="stylesheet" href="css/formulario-tarefa.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="cabeçalho">
            <h1 class="titulo-cabeçalho">Sistema de Gestão</h1>
            <span>Loja: laricão Lanches</span>
        </div>
        <div class="menu">
            <ul>
                <a href="lista-tarefa.html"><li class="borda-menu">Gestão de tarefas</li></a>
                <a href="gestao-estoque.html"><li>Gestão de estoque</li></a>
            </ul>
        </div>
    </header>
    <main>
        <div class="main-tarefa">
            <div class="main1-2">
                <div class="a-fazer" id="div-a-fazer">
                    <span class="titulo"><h3>Pendentes:</h3></span>
                    <div class="boxes" id="boxes-a-fazer">
                    </div>
                </div>
                <div class="feito">
                    <span class="titulo"><h3>Ultimas concluídas:</h3></span>
                    <div class="boxes" id="div-feito">  
                    </div>
                </div>
            </div>
            <div class="main2-2">
                <div class="topo-form">
                    <button class="botao-topo-form" id="botao-adicionar-tarefa-topo">Adicionar Tarefa</button>
                </div>
                <div class="formulario-to-do" id="form-tarefa">
                    <form action="">
                        <div>
                            <label for="nome-tarefa">tarefa:</label>
                            <input type="text" name="nome-tarefa" id="nome-tarefa-input">
                        </div>
                        <div>
                                <label for="prioridades">Escolha a prioridade:</label>
                                <select name="prioridades" id="prioridade-input">
                                    <option value="Alta">Alta</option>
                                    <option value="Média">Média</option>
                                    <option value="Baixa">Baixa</option>
                                </select>
                        </div>
                        <div>
                            <label for="categorias">Selecione a categoria:</label>
                            
                            <select name="categorias" id="categorias-input">
                                <option value="Gestão">Gestão</option>
                                <option value="Limpeza">Limpeza</option>
                                <option value="Abastecimento">Abastecimento</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>
                        <div>
                            <label for="usuarios">Usuario:</label>
                            <input list="usuarios" id="usuarios-input" name="lista-usuarios">

                            <datalist id="usuarios">
                                <option value="Robert"></option>
                                <option value="Matheus"></option>
                                <option value="Gabriel"></option>
                                <option value="Misael"></option>
                            </datalist>
                        </div>
                        <div>
                            <button id="botao-adicionar" type="button">Adicionar</button>
                            <button id="cancelar-tarefa">Cancelar</button>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/jq.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
